plugins {
    id 'org.jetbrains.kotlin.jvm'
}
[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

dependencies {
  api "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"
  api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
  api "com.badlogicgames.gdx:gdx:$gdxVersion"

  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
}

// The game keeps users and games in files relative to the working directory (users/, GAMES/ ...).
// Tests therefore run in their own folder, and every test recreates it (see support/TestWorld).
test {
    useJUnitPlatform()
    workingDir = layout.buildDirectory.dir("test-work").get().asFile
    doFirst { workingDir.mkdirs() }
    testLogging {
        events "passed", "failed"
        exceptionFormat "full"
        showStandardStreams = false
    }
}
repositories {
    mavenCentral()
}
java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }
}
