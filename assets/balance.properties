# Optional tuning knobs. Delete a line (or the whole file) to get the default behaviour.
# The file is re-read about every 2 seconds, so most values can be changed while the game runs
# (game.tick.millis is read when a game session starts).

# 1.0 = unchanged. 2.0 = twice as much production / twice as expensive / twice as slow to build.
production.multiplier=1.0
cost.multiplier=1.0
buildtime.multiplier=1.0

# Mercenary quarters: hired soldiers per Castle level (default 20).
mercenary.slots.per.castle.level=20

# Minutes (at game speed 1) a fallen hero needs before he can fight again (default 10).
hero.revive.minutes=10

# Percent of a raided storage's stock that the attacker takes (default 50).
loot.percent=50

# Game tick in milliseconds (default 1000, allowed 200..10000).
game.tick.millis=1000

# Battle tuning (defaults shown).
# Each further row of the formation attacks with this share of the previous row's power (0.1 .. 1.0).
battle.row.efficiency=0.9
# Attack multiplier of an army led by an available hero (1.0 .. 3.0).
battle.hero.attack.buff=1.1
# Share of its power a garrison keeps when it is surprised by an ambush (0.0 .. 1.0).
battle.ambush.defense.factor=0.5
# Attackers lose this percent of their health against Winterfell (0 .. 90).
battle.winterfell.health.percent=10
# Attackers lose this percent of their attack power against the Eyrie (0 .. 90).
battle.eyrie.attack.percent=15

# Computer players. bots.count = how many empty kingdoms get a bot when a game starts (0 = none, max 6; a lone
# player can then start a game). Bots are not saved in users/ and cannot log in. bots.garrison = their home guard.
bots.count=0
bots.garrison=30

# Seasonal events (off by default). events.enabled=1 turns them on. Each game day has events.chance.percent chance
# of an event: summer/fall harvest (+food), winter famine (-food), spring trade windfall (+coin). Every kingdom is
# affected by the same events.effect.percent (1..50) of its storage.
events.enabled=0
events.chance.percent=15
events.effect.percent=10

# Bot growth (off by default): every game day each bot recruits bots.growth.perDay soldiers (0..50),
# never beyond bots.garrison.max.
bots.growth.perDay=0
bots.garrison.max=200

# Bot economy (off by default): 1 = once per game day each bot builds one storage or mine, with the same costs and
# rules as a player (the first mine and storage of each resource are free, so bots can bootstrap).
bots.build.enabled=0

# Bot army (off by default): bots with a Barrack queue this many soldiers per game day (0..50), paying the normal
# cost. Bots reach the Barrack by upgrading the castle when bots.build.enabled=1.
bots.train.perDay=0
