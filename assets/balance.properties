# Optional tuning knobs. Delete a line (or the whole file) to get the default behaviour.
# The file is re-read about every 2 seconds, so most values can be changed while the game runs
# (game.tick.millis is read when a game session starts).

# 1.0 = unchanged. 2.0 = twice as much production / twice as expensive / twice as slow to build.
production.multiplier=1.0
cost.multiplier=1.0
buildtime.multiplier=1.0

# Mercenary quarters: hired soldiers per Castle level (default 20).
mercenary.slots.per.castle.level=20

# Minutes (at game speed 1) a fallen hero needs before he can fight again (default 10).
hero.revive.minutes=10

# Percent of a raided storage's stock that the attacker takes (default 50).
loot.percent=50

# Game tick in milliseconds (default 1000, allowed 200..10000).
game.tick.millis=1000
